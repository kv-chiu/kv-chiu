<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
    <defs>
        <style>
            .metal-text {
                font-family: 'Georgia', 'Times New Roman', serif;
                font-style: italic;
                font-weight: bold;
                font-size: 180px;
                text-anchor: middle;
                dominant-baseline: middle;
            }
            .bg { fill: #1a1a1a; }
        </style>

        <linearGradient id="gold-metal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#BF953F" />
            <stop offset="25%" stop-color="#FCF6BA" />
            <stop offset="50%" stop-color="#B38728" />
            <stop offset="75%" stop-color="#FBF5B7" />
            <stop offset="100%" stop-color="#AA771C" />
        </linearGradient>

        <linearGradient id="shine-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="40%" stop-color="rgba(255,255,255,0.7)" />
            <stop offset="50%" stop-color="rgba(255,255,255,1)" />
            <stop offset="60%" stop-color="rgba(255,255,255,0.7)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>

        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
        </filter>

        <mask id="text-mask">
            <text x="50%" y="55%" class="metal-text" fill="#FFFFFF">chiu</text>
        </mask>
    </defs>

    <rect width="100%" height="100%" class="bg" rx="15" />

    <text x="50%" y="55%" class="metal-text" fill="url(#gold-metal)" filter="url(#drop-shadow)">chiu</text>

    <g mask="url(#text-mask)">
        <rect y="-50" width="150" height="350" fill="url(#shine-gradient)" transform="skewX(-30)">
            <animate 
                attributeName="x" 
                from="-300" 
                to="700" 
                dur="3.5s" 
                repeatCount="indefinite" 
                calcMode="spline" 
                keyTimes="0; 1" 
                keySplines="0.4 0 0.2 1"
            />
        </rect>
    </g>
</svg>